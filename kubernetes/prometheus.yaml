# Prometheus deployment for dispatch

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: dispatch
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
    - job_name: 'dispatch-api'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - dispatch
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: dispatch-api
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-storage
          mountPath: /prometheus
        - name: config
          mountPath: /etc/prometheus
      volumes:
      - name: prometheus-storage
        emptyDir: {}
      - name: config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: dispatch
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
