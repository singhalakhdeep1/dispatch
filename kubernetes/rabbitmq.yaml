# RabbitMQ deployment for dispatch

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672
        - containerPort: 15672
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "admin"
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: password
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: dispatch
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
  - name: management
    port: 15672
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: dispatch
type: Opaque
stringData:
  password: "changeme"
