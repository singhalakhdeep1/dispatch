syntax = "proto3";

package orders;

// ─── CreateOrder ──────────────────────────────────────────────────────────────

message OrderItem {
  string menu_item_id = 1;
  int32  quantity      = 2;
}

message CreateOrderRequest {
  string restaurant_id   = 1;
  string address_id      = 2;
  string delivery_address = 3;
  double delivery_lat    = 4;
  double delivery_lng    = 5;
  repeated OrderItem items = 6;
  string user_id         = 7;
  string user_role       = 8;
}

message CreateOrderResponse {
  string  id             = 1;
  string  status         = 2;
  int64   total_amount   = 3;   // paise
  int64   delivery_fee   = 4;   // paise
  double  surge_multiplier = 5;
  int32   estimated_delivery_mins = 6;
}

// ─── GetOrder ────────────────────────────────────────────────────────────────

message GetOrderRequest {
  string order_id = 1;
  string user_id  = 2;
  string user_role = 3;
}

message GetOrderResponse {
  string id             = 1;
  string status         = 2;
  string restaurant_id  = 3;
  string user_id        = 4;
  string driver_id      = 5;
  int64  total_amount   = 6;
  string created_at     = 7;
}

// ─── UpdateOrderStatus ────────────────────────────────────────────────────────

message UpdateOrderStatusRequest {
  string order_id  = 1;
  string status    = 2;
  string user_id   = 3;
  string user_role = 4;
}

message UpdateOrderStatusResponse {
  string id     = 1;
  string status = 2;
}

// ─── Service ─────────────────────────────────────────────────────────────────

service OrdersService {
  rpc CreateOrder       (CreateOrderRequest)       returns (CreateOrderResponse);
  rpc GetOrder          (GetOrderRequest)          returns (GetOrderResponse);
  rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
}
